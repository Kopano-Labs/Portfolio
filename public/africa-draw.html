<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CPUT Libraries — Africa Day Trivia Draw</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #facc15;
      background: rgba(250, 204, 21, 0.1);
      border: 1px solid rgba(250, 204, 21, 0.2);
      border-radius: 999px;
      padding: 0.3rem 1rem;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.75rem;
      color: #ffffff;
      margin-bottom: 0.25rem;
      line-height: 1.2;
    }

    h1 span { color: #facc15; }

    .subtitle {
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 1.5rem;
    }

    #names-input {
      width: 100%;
      height: 140px;
      border-radius: 0.75rem;
      padding: 0.85rem 1rem;
      border: 1px solid #334155;
      background: #020617;
      color: #e5e7eb;
      font-size: 0.95rem;
      line-height: 1.6;
      resize: none;
      transition: border-color 0.2s;
    }

    #names-input:focus {
      outline: none;
      border-color: #f59e0b;
    }

    .prefilled-note {
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: 0.5rem;
      text-align: left;
    }

    #draw-btn {
      margin-top: 1.5rem;
      padding: 0.9rem 2.5rem;
      border-radius: 9999px;
      border: none;
      background: linear-gradient(135deg, #f59e0b, #f97316);
      color: #111827;
      font-weight: 700;
      cursor: pointer;
      font-size: 1.1rem;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 24px rgba(245, 158, 11, 0.3);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    #draw-btn:hover:not(:disabled) {
      transform: scale(1.04);
      box-shadow: 0 6px 32px rgba(245, 158, 11, 0.45);
    }

    #draw-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-area {
      margin-top: 2.5rem;
      min-height: 100px;
    }

    #display {
      font-size: 1.6rem;
      font-weight: 700;
      color: #a5b4fc;
      min-height: 2.5rem;
      transition: color 0.1s;
    }

    #display.cycling { color: #818cf8; }

    #winner {
      margin-top: 0.75rem;
      font-size: 1.4rem;
      color: #22c55e;
      font-weight: 800;
    }

    #winner::before {
      content: "🎉 ";
    }

    #winner:empty::before {
      content: "";
    }

    .confetti {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 999;
    }

    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      opacity: 0;
      animation: confetti-fall 3s ease-out forwards;
    }

    @keyframes confetti-fall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    .footer {
      margin-top: 2.5rem;
      font-size: 0.7rem;
      color: #4b5563;
      text-align: center;
    }

    .footer a {
      color: #6b7280;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">CPUT Libraries · Africa Day 2026</div>
    <h1>Africa Trivia: <span>Live Draw</span></h1>
    <p class="subtitle">Random winner selection from Facebook comments</p>

    <textarea id="names-input">Dineo Mokgadi
Nomagcisa MakaAli Maradebe Soqinase
Ncumisa Mboniswa
Aphumelele Bambiso
Nico Gertse
Preez PW</textarea>

    <p class="prefilled-note">Pre-filled with the 6 commenters. Edit if needed.</p>

    <button id="draw-btn">🎲 Draw Winner</button>

    <div class="result-area">
      <div id="display"></div>
      <div id="winner"></div>
    </div>

    <div class="footer">
      <a href="https://www.facebook.com/photo/?fbid=1640327541316078&set=a.419646470050864" target="_blank">
        View original Facebook post
      </a>
    </div>
  </div>

  <div class="confetti" id="confetti-container"></div>

  <script>
    const btn = document.getElementById("draw-btn");
    const input = document.getElementById("names-input");
    const display = document.getElementById("display");
    const winnerEl = document.getElementById("winner");
    const confettiContainer = document.getElementById("confetti-container");

    function getNames() {
      return input.value
        .split("\n")
        .map(n => n.trim())
        .filter(n => n.length > 0);
    }

    function pickRandom(names) {
      return names[Math.floor(Math.random() * names.length)];
    }

    function launchConfetti() {
      confettiContainer.innerHTML = "";
      const colors = ["#facc15", "#f97316", "#22c55e", "#a5b4fc", "#f43f5e", "#06b6d4"];
      for (let i = 0; i < 60; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti-piece";
        piece.style.left = Math.random() * 100 + "%";
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDelay = (Math.random() * 0.8) + "s";
        piece.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
        piece.style.width = (6 + Math.random() * 8) + "px";
        piece.style.height = (6 + Math.random() * 8) + "px";
        confettiContainer.appendChild(piece);
      }
    }

    btn.addEventListener("click", () => {
      const names = getNames();

      if (names.length === 0) {
        alert("Please enter at least one name.");
        return;
      }

      btn.disabled = true;
      winnerEl.textContent = "";
      display.classList.add("cycling");
      confettiContainer.innerHTML = "";

      let iterations = 0;
      const maxIterations = 30;
      let delay = 60;

      function cycle() {
        const current = pickRandom(names);
        display.textContent = current;
        iterations++;

        if (iterations >= maxIterations) {
          display.classList.remove("cycling");
          const finalWinner = pickRandom(names);
          display.textContent = finalWinner;
          winnerEl.textContent = `Winner: ${finalWinner}`;
          btn.disabled = false;
          launchConfetti();
          return;
        }

        delay += 8;
        setTimeout(cycle, delay);
      }

      cycle();
    });
  </script>
</body>
</html>
